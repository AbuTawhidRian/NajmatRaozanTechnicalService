name: Deploy Next.js to Contabo VPS

on:
  push:
    branches:
      - main
      - master # Triggers on both main and master just in case

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            # Set the directory where the app will be located on the VPS
            # Update this path to match your desired location on the server
            APP_DIR="~/-NajmatRaozanTechnicalService"
            
            # Check if directory exists, if not create it
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory does not exist. Creating and cloning..."
              mkdir -p "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            # Pull latest code
            git pull origin main || git pull origin master
            
            # Rebuild the Docker container and start it
            # The --build flag ensures the new code is built into the image
            # The -d flag runs it in detached mode
            docker-compose up -d --build
            
            # Run Prisma database migrations to update the NajmatRaozanTechnicalService database
            echo "Syncing database schema..."
            docker-compose exec -T web sh -c 'npx prisma db push'
            
            # Optional: Prune unused Docker images to free up space
            docker image prune -f
