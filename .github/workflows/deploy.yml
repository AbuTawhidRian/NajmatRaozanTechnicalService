name: Deploy Next.js to Contabo VPS

on:
  push:
    branches:
      - main
      - master # Triggers on both main and master just in case

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            # Set the directory where the app will be located on the VPS
            # Update this path to match your desired location on the server
            APP_DIR="$HOME/NajmatRaozanTechnicalService"
            
            # Check if directory exists, if not create it
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory does not exist. Creating and cloning..."
              mkdir -p "$APP_DIR"
              git clone https://github.com/AbuTawhidRian/NajmatRaozanTechnicalService.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            # Pull latest code
            git pull origin main || git pull origin master
            
            # Copy the .env file from the old folder so the database connection works
            cp ~/-NajmatRaozanTechnicalService/.env "$APP_DIR/.env" || true
            
            # Rebuild the Docker container (zero downtime during this 60s step)
            docker-compose build
            
            # Safely clear old containers to prevent ContainerConfig bugs
            docker-compose down --remove-orphans || true
            
            # Start the new container (only 1-2s of downtime)
            docker-compose up -d
            
            # NOTE: To run schema migrations manually, SSH into the VPS and run:
            # docker-compose exec web npx prisma@7 db push
            
            # Optional: Prune unused Docker images to free up space
            docker image prune -f
