version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rolling-shutter-web:latest
    container_name: rolling-shutter-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # This is hardcoded (not from .env) so no substitution needed
      - AUTH_TRUST_HOST=true
    networks:
      - rxsheba_app-network
    volumes:
      - uploads-data:/app/public/uploads

networks:
  rxsheba_app-network:
    external: true

volumes:
  uploads-data:
