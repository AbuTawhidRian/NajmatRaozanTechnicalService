version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rolling-shutter-web:latest
    container_name: rolling-shutter-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - AUTH_TRUST_HOST=true
    networks:
      - rxsheba_app-network
    volumes:
      - ./public/uploads:/app/public/uploads

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: rolling-shutter-migrate:latest
    container_name: rolling-shutter-migrate
    env_file:
      - .env
    networks:
      - rxsheba_app-network
    restart: "no"

networks:
  rxsheba_app-network:
    external: true
