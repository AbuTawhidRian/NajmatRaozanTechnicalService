version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-app
    container_name: nextjs_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database connection string
      - DATABASE_URL=${DATABASE_URL}
      # NextAuth configuration
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    networks:
      - rxsheba_app-network

networks:
  rxsheba_app-network:
    external: true
